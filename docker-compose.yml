# Yerel geliştirme:   docker compose up -d db
# Üretim imajı denemesi: docker compose --profile app up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tp
      POSTGRES_PASSWORD: tp_yerel_parola
      POSTGRES_DB: tedarikci
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp -d tedarikci"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tp:tp_yerel_parola@db:5432/tedarikci?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET .env dosyasında tanımlı olmalı}
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"

volumes:
  pgdata:
